name: Resumen Telegram RT

on:
  schedule:
    # Corre todos los días a las 6:45 AM hora de California (14:45 UTC)
    - cron: '45 14 * * *'
  workflow_dispatch:
    inputs:
      canal_prueba:
        description: "Canal alternativo para probar solo la lectura de Telegram"
        required: false
        default: "rtnoticias"
        type: string

permissions:
  contents: write

jobs:
  run-python:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar librerías
        run: pip install -r requirements.txt

      - name: Ejecutar script de extracción
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TG_TEST_CHANNEL: ${{ inputs.canal_prueba }}
        run: python main.py

      - name: Publicar archivos de la prueba
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultado-prueba-rt-${{ github.run_number }}
          path: |
            publicaciones_prueba.txt
            resumen_prueba.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Guardar cambios del resumen diario
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add ultimo_id.txt resumen_hoy.txt
          if ! git diff --cached --quiet; then
            git commit -m "Actualización del resumen diario"
            git push
          else
            echo "No hay cambios en el cursor ni en el resumen; no se crea ningún commit."
          fi
